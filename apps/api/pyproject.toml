[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videochat-api"
version = "0.0.1"
description = "Self-hosted video chat API service"
requires-python = ">=3.11"
readme = "README.md"
authors = [
  { name = "Self-Hosted Video Chat" }
]
keywords = ["fastapi", "webrtc", "socket-io"]
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<0.31.0",
  "python-socketio[asyncio]>=5.11.0,<6.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "sqlalchemy>=2.0.32,<3.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "redis>=5.0.8,<6.0.0",
  "alembic>=1.13.2,<2.0.0",
  "passlib[argon2]>=1.7.4,<2.0.0",
  "PyJWT>=2.9.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.8,<0.7.0",
  "mypy>=1.11.2,<2.0.0",
  "pytest>=8.3.3,<9.0.0",
  "pytest-asyncio>=0.23.0,<0.24.0",
  "httpx>=0.27.0,<0.28.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["videochat_api*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
